# Backend only. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: ecoiq-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EMBEDDING_MODEL
        value: hashing
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: CHROMA_PATH
        value: /tmp/chroma_data
      # Comma-separated origins allowed to call the API (your Vercel URLs).
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
